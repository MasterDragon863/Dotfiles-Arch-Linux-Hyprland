# --- Font Settings ---
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# --- Window & Transparency Settings ---
# Increased opacity from 0.75 to 0.88 means less transparency/blur
background_opacity         0.9
dynamic_background_opacity yes
background_blur            1
hide_window_decorations    yes

# --- Vignette Background Image ---
background_image            ~/.config/kitty/backgrounds/vignette.png
background_image_layout     scaled
background_image_linear     yes

# This controls how strong the image shows through the transparency
background_tint             0.92
background_opacity          0.88
background_blur             1

# --- Deep Blue & Bright Orange Color Scheme ---
background            #0f141c
foreground            #ff6600
cursor                #ff6600
cursor_text_color     #0f141c
selection_background  #ff6600
selection_foreground  #0f141c

# --- Terminal Color Palette ---
# Black
color0  #161c25
color8  #434f61

# Red
color1  #ff3333
color9  #ff5555

# Green
color2  #00ff66
color10 #55ff55

# Yellow/Orange
color3  #ff6600
color11 #ff8833

# Blue
color4  #00a6ff
color12 #33b8ff

# Magenta
color5  #b800ff
color13 #d155ff

# Cyan
color6  #00f0ff
color14 #55f3ff

# White
color7  #e2e2e6
color15 #ffffff

window_margin_width 4
